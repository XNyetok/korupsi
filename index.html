<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0D1418">
<meta name="description" content="Panjat kantor kelurahan dari lobi sampai pintu kecamatan. Ambil amplop, ngeles dari auditor, dan jangan sampai kena OTT.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Korupsi">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta property="og:title" content="Korupsi">
<meta property="og:description" content="Platformer pixel art: panjat birokrasi, ambil amplop, ngeles dari auditor.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://korupsi.web.id/">
<meta property="og:image" content="https://korupsi.web.id/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Korupsi: seorang pejabat bersafari memanjat kantor kelurahan sambil menghindari auditor.">
<meta property="og:site_name" content="Korupsi">
<meta name="author" content="nyetok.id">
<meta name="twitter:card" content="summary_large_image">
<title>Korupsi</title>
</head>
<body>
<div id="stage">
  <div id="screen">
    <canvas id="game" width="384" height="216" tabindex="0" role="application" aria-label="Korupsi: jalan, lompat dan ngeles sampai ke pintu kecamatan"></canvas>

    <div id="hud" aria-hidden="true">
      <span class="chip" id="hud-floor">01 Kelurahan</span>
      <div class="group">
        <span class="chip gold" id="hud-money">Rp 0</span>
        <span class="chip" id="hud-weight" hidden>Beban 0</span>
        <span class="chip" id="hud-deaths">OTT 0</span>
        <span class="chip" id="hud-time">0:00</span>
      </div>
    </div>

    <div class="tools">
      <button id="pause" class="tool" type="button" aria-label="Jeda">
        <svg viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges"><path d="M2 1h1v6H2zM5 1h1v6H5z"/></svg>
      </button>
      <button id="full" class="tool" type="button" aria-pressed="false" aria-label="Layar penuh" hidden>
        <svg viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 1h2v1H2v1H1zM5 1h2v2H6V2H5zM1 5h1v1h1v1H1zM6 5h1v2H5V6h1z"/></svg>
      </button>
      <button id="mute" class="tool" type="button" aria-pressed="false" aria-label="Matikan suara">
        <svg class="icon-on" viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 3h2v2H1zM3 2h1v4H3zM4 1h1v6H4zM6 2h1v1H6zM6 5h1v1H6zM7 3h1v2H7z"/></svg>
        <svg class="icon-off" viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 3h2v2H1zM3 2h1v4H3zM4 1h1v6H4zM6 2h1v1H6zM7 3h1v1H7zM6 4h1v1H6zM7 5h1v1H7z"/></svg>
      </button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <div id="touch" aria-hidden="true">
    <div id="pad" class="pad"><span>◀</span><span>▶</span></div>
    <div class="actions">
      <div id="btn-dash" class="action dash">Ngeles</div>
      <div id="btn-jump" class="action jump">Lompat</div>
    </div>
  </div>

  <div id="overlay"></div>
  <div id="debug"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
