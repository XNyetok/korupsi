<!doctype html>
<html lang="id" data-build="__BUILD__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0E14">
<meta name="description" content="Panjat birokrasi satu lompatan sekaligus. Ambil amplop untuk skor; makin berat, makin pendek lompatanmu.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Korupsi">
<meta property="og:description" content="Panjat birokrasi satu lompatan sekaligus. Makin berat, makin pendek lompatanmu.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://korupsi.web.id/">
<meta name="twitter:card" content="summary">
<title>Korupsi — prototipe</title>
<style>
  :root {
    --ink: #0a0d12;
    --paper: #e7e2d6;
    --muted: #8b95a3;
    --gold: #e9b949;
    --red: #e5524a;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    overflow: hidden;
    color: var(--paper);
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    justify-content: center;
    overscroll-behavior: none;
  }

  #stage {
    position: relative;
    width: 100%;
    max-width: 520px;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--ink);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    outline: none;
  }

  /* ---------- HUD ---------- */

  #scrim {
    position: absolute;
    inset: 0 0 auto 0;
    height: 150px;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(7, 10, 14, 0.92), rgba(7, 10, 14, 0));
    opacity: 0;
    transition: opacity 200ms ease;
  }

  body.is-playing #scrim { opacity: 1; }

  #hud {
    position: absolute;
    inset: 0 0 auto 0;
    padding: calc(12px + env(safe-area-inset-top)) 16px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 200ms ease;
  }

  body.is-playing #hud { opacity: 1; }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .stat { display: flex; flex-direction: column; gap: 1px; }
  .stat.right { align-items: flex-end; }

  .label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .value {
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .value.gold { color: var(--gold); }

  .weight {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .bar {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--gold);
    transition: width 120ms linear, background 200ms ease;
  }

  /* ---------- Overlay ---------- */

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(8, 11, 15, 0.93) 0%, rgba(8, 11, 15, 0.78) 45%, rgba(8, 11, 15, 0.93) 100%);
    opacity: 0;
    visibility: hidden;
    transition: opacity 180ms ease, visibility 180ms;
  }

  #overlay.is-visible { opacity: 1; visibility: visible; }

  .card {
    width: 100%;
    max-width: 330px;
    text-align: center;
  }

  .card.ready {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 9vh 0 21vh;
  }

  .eyebrow {
    margin: 0 0 10px;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--red);
  }

  .card h1 {
    margin: 0 0 14px;
    font-size: 34px;
    line-height: 1;
    letter-spacing: -0.03em;
    font-weight: 700;
  }

  .card h1.money {
    font-size: 30px;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }

  .lede {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.5;
    color: #b9c1cc;
    text-wrap: balance;
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 0 0 18px;
    font-size: 11px;
    color: var(--muted);
  }

  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .dot { width: 8px; height: 8px; border-radius: 2px; }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 0 0 14px;
    font-variant-numeric: tabular-nums;
  }

  .stats span {
    display: flex;
    flex-direction: column;
    gap: 2px;
    white-space: nowrap;
  }

  .stats i {
    font-style: normal;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stats b { color: var(--paper); font-weight: 600; font-size: 13px; }

  .rev {
    margin: 10px 0 0;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #5b6472;
    font-variant-numeric: tabular-nums;
  }

  .record {
    margin: 0 0 22px;
    font-size: 11px;
    color: #6f7a89;
    font-variant-numeric: tabular-nums;
  }

  .stamp {
    display: inline-block;
    margin: 0 0 14px;
    padding: 5px 13px;
    border: 2px solid rgba(217, 72, 59, 0.75);
    border-radius: 3px;
    color: #e8695c;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    transform: rotate(-2.5deg);
  }

  .card h1 { text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55); }

  .cta {
    align-self: center;
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--paper);
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid rgba(231, 226, 214, 0.22);
  }

  /* ---------- Debug ---------- */

  #debug {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: calc(8px + env(safe-area-inset-bottom));
    display: none;
    gap: 6px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(6, 8, 11, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 10px;
    color: #9aa4b2;
    backdrop-filter: blur(6px);
  }

  #debug.is-on { display: grid; grid-template-columns: 1fr 1fr; }
  #debug.is-muted { display: none; }

  #debug label { display: flex; flex-direction: column; gap: 2px; }
  #debug input { width: 100%; accent-color: var(--gold); }
  #debug .readout { grid-column: 1 / -1; color: #6f7a89; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" tabindex="0" role="application" aria-label="Korupsi: ketuk kiri atau kanan layar untuk melompat"></canvas>

  <div id="scrim" aria-hidden="true"></div>

  <div id="hud" aria-hidden="true">
    <div class="row">
      <div class="stat">
        <span class="label">Dibawa</span>
        <span class="value gold" id="hud-money">Rp 0</span>
      </div>
      <div class="stat right">
        <span class="label">Tinggi</span>
        <span class="value" id="hud-height">0 m</span>
      </div>
    </div>
    <div class="weight">
      <span id="hud-weight">Beban 0</span>
      <div class="bar"><i id="hud-bar"></i></div>
    </div>
  </div>

  <div id="overlay"></div>
  <div id="debug"></div>
</div>

<script>
(() => {
  'use strict';

  // Tunables. Change here first, then write down what won in docs/design/.
  const params = {
    gravity: 1900,
    jumpV: 700,
    moveVX: 115,
    weightPenalty: 0.03,
    minFactor: 0.45,
    gapMin: 0.42,
    gapMax: 0.62,
    cameraBase: 26,
    cameraAccel: 1.3,
    crumbleDelay: 0.45,
    moneyValue: 500000,
    pixelsPerMetre: 6,
    goldChance: 0.45,
    doubleGoldChance: 0,
  };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const hudMoney = document.getElementById('hud-money');
  const hudHeight = document.getElementById('hud-height');
  const hudWeight = document.getElementById('hud-weight');
  const hudBar = document.getElementById('hud-bar');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 360;
  let H = 640;

  // Ink on paper: the world is an archive, the money is a ledger entry.
  const C = {
    ink: '#0A0E14',
    inkDeep: '#070A0E',
    paper: '#F0E9DB',
    paperMid: '#C9C0AF',
    paperDark: '#8F8674',
    crate: '#8A6A4B',
    crateDark: '#664C33',
    gold: '#E3B04B',
    goldLight: '#F4D58D',
    goldDark: '#986D1D',
    red: '#D9483B',
    slate: '#7C8896',
    suit: '#1F2A37',
    skin: '#E8D3B8',
  };

  // ---------- state ----------

  let phase = 'ready'; // ready | playing | over
  let platforms = [];
  let auditors = [];
  let floaters = [];
  let money = 0;
  let weight = 0;
  let camY = 0;
  let camSpeed = 0;
  let maxClimb = 0;
  let lastFooting = 0;
  let squash = 1;
  let dust = [];
  let shake = 0;
  let cause = '';
  let nextId = 1;

  const player = { x: 0, y: 0, vx: 0, vy: 0, onGround: null, dir: 1 };

  let best = readBest();

  // ---------- helpers ----------

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const round = (n) => Math.round(n);

  function readBest() {
    try {
      const raw = localStorage.getItem('korupsi.best');
      if (!raw) return { money: 0, height: 0 };
      const parsed = JSON.parse(raw);
      return { money: Number(parsed.money) || 0, height: Number(parsed.height) || 0 };
    } catch {
      return { money: 0, height: 0 };
    }
  }

  function writeBest() {
    try {
      localStorage.setItem('korupsi.best', JSON.stringify(best));
    } catch {
      /* private mode, ignore */
    }
  }

  const rupiah = (n) => 'Rp ' + n.toLocaleString('id-ID');
  const height = () => Math.round(maxClimb / params.pixelsPerMetre);

  function jumpFactor() {
    return Math.max(params.minFactor, 1 - params.weightPenalty * weight);
  }

  // Envelope of a jump at the current weight: rise, air time, and horizontal
  // travel at the moment the player crosses a ledge `dy` above the launch point.
  function envelope(factor) {
    const jv = params.jumpV * factor;
    const g = params.gravity;
    const h = (jv * jv) / (2 * g);
    const air = (2 * jv) / g;
    return {
      jv,
      h,
      air,
      dxAt(dy) {
        const inner = Math.max(0, jv * jv - 2 * g * dy);
        const t = (jv + Math.sqrt(inner)) / g;
        return params.moveVX * t;
      },
    };
  }

  // ---------- world ----------

  function topPlatform() {
    let top = platforms[0];
    for (const p of platforms) if (p.y < top.y) top = p;
    return top;
  }

  function riskyType() {
    const r = Math.random();
    if (r < 0.66) return 'solid';
    if (r < 0.88) return 'krat';
    return 'fiktif';
  }

  function makeOption(anchorX, anchorY, dir, dy, env, gold) {
    const w = gold ? rand(60, 74) : rand(84, 108);
    const lo = w / 2 + 10;
    const hi = W - w / 2 - 10;
    if (lo > hi) return null;

    // Horizontal speed is constant, so the landing spot is fixed for a given
    // rise. Place the ledge around that spot, with the offset small enough
    // that the player still lands on it.
    // The landing point is fixed, so the ledge sits around it. The minimum
    // distance keeps the pair reading as left/right instead of two shelves
    // bunched under the player's own column.
    const travel = env.dxAt(dy);
    const jitter = rand(-w * 0.28, w * 0.28);
    const x = anchorX + dir * Math.max(58, travel + jitter);

    if (x < lo || x > hi) return null;

    return {
      id: nextId++,
      x,
      y: anchorY - dy,
      w,
      gold,
      type: gold ? riskyType() : Math.random() < 0.35 ? 'krat' : 'solid',
      crumble: 0,
      alive: true,
      taken: false,
    };
  }

  // One level of the climb: two ledges at the same height, one of them usually
  // carrying money. The player's only decision is which side to tap.
  function generateChoices(anchorX, anchorY) {
    const env = envelope(jumpFactor());
    const dy = rand(env.h * params.gapMin, env.h * params.gapMax);

    const roll = Math.random();
    let goldLeft = false;
    let goldRight = false;
    if (roll < params.goldChance) {
      if (Math.random() < 0.5) goldLeft = true;
      else goldRight = true;
    } else if (roll < params.goldChance + params.doubleGoldChance) {
      goldLeft = true;
      goldRight = true;
    }

    // The first level always shows the choice, so the mechanic is visible
    // before the player has to guess at it.
    if (levelsClimbed() < 1) {
      goldLeft = Math.random() < 0.5;
      goldRight = !goldLeft;
    }

    const left = makeOption(anchorX, anchorY, -1, dy, env, goldLeft);
    const right = makeOption(anchorX, anchorY, 1, dy, env, goldRight);

    const placed = [];
    if (left) {
      platforms.push(left);
      placed.push(left);
    }
    if (right) {
      platforms.push(right);
      placed.push(right);
    }

    // If both sides were out of bounds, fall back to one reachable ledge.
    if (!placed.length) {
      const w = rand(70, 100);
      const travel = env.dxAt(dy);
      const dir = anchorX < W / 2 ? 1 : -1;
      const x = clamp(anchorX + dir * travel, w / 2 + 10, W - w / 2 - 10);
      const plat = {
        id: nextId++,
        x,
        y: anchorY - dy,
        w,
        gold: false,
        type: 'solid',
        crumble: 0,
        alive: true,
        taken: false,
      };
      platforms.push(plat);
      placed.push(plat);
    }

    // A single ledge means no choice, so it must never be the risky one.
    if (placed.length === 1 && placed[0].gold) {
      placed[0].gold = false;
      placed[0].type = 'solid';
      placed[0].w = Math.max(placed[0].w, 84);
    }

    maybeAddAuditor(anchorY, placed);
  }

  function maybeAddAuditor(anchorY, placed) {
    if (levelsClimbed() < 5) return;
    const gold = placed.find((p) => p.gold);
    if (!gold) return;
    if (Math.random() > 0.5) return;

    // The auditor only guards the money: its patrol never reaches the safe
    // ledge, so choosing the safe side always works.
    const reach = gold.w / 2 + 26;
    auditors.push({
      lowerY: anchorY,
      upper: gold,
      x: gold.x,
      dir: Math.random() < 0.5 ? -1 : 1,
      speed: rand(34, 62),
      w: 30,
      h: 26,
      y: gold.y - 11,
      minX: gold.x - reach,
      maxX: gold.x + reach,
    });
  }

  function levelsClimbed() {
    return Math.round(-topPlatform().y / 70);
  }

  // After landing, everything above the new footing is stale: it was generated
  // from the previous position and no longer describes a reachable path.
  function rebuildAhead() {
    const anchor = player.onGround;
    if (!anchor) return;
    // Keep the ledge underfoot: the filter used to drop it, so the player was
    // left standing on a platform that no longer existed on screen.
    platforms = platforms.filter((p) => p === anchor || p.y >= anchor.y);
    auditors = [];
    generateChoices(player.x, anchor.y);
  }

  function resetWorld() {
    platforms = [];
    auditors = [];
    floaters = [];
    money = 0;
    weight = 0;
    maxClimb = 0;
    lastFooting = 0;
    squash = 1;
    dust = [];
    shake = 0;
    cause = '';
    nextId = 1;

    const groundW = Math.min(W - 56, 220);
    const ground = {
      id: nextId++,
      x: W / 2,
      y: 0,
      w: groundW,
      gold: false,
      type: 'solid',
      crumble: 0,
      alive: true,
      taken: false,
    };
    platforms.push(ground);

    player.x = ground.x;
    player.y = ground.y;
    player.vx = 0;
    player.vy = 0;
    player.onGround = ground;
    player.dir = 1;

    camY = player.y - H * 0.62;
    camSpeed = params.cameraBase;

    generateChoices(ground.x, ground.y);
  }

  // ---------- flow ----------

  function start() {
    resetWorld();
    phase = 'playing';
    overlay.classList.remove('is-visible');
    document.body.classList.add('is-playing');
    updateHud();
  }

  function endRun(reason) {
    phase = 'over';
    cause = reason;
    shake = reduceMotion ? 0 : 1;

    const h = height();
    if (money > best.money || (money === best.money && h > best.height)) {
      best = { money, height: h };
      writeBest();
    }
    showResult();
  }

  function jump(dir) {
    if (!player.onGround) return;
    const plat = player.onGround;

    player.vy = -params.jumpV * jumpFactor();
    player.vx = dir * params.moveVX;
    player.dir = dir;
    player.onGround = null;

    squash = 0.86;
    puff(6, 0);

    if (plat.type === 'fiktif' && plat.crumble === 0) plat.crumble = 0.0001;
  }

  function puff(count, drift) {
    for (let i = 0; i < count; i++) {
      dust.push({
        x: player.x + rand(-9, 9),
        y: player.y - 1,
        vx: rand(-30, 30) + drift,
        vy: rand(-52, -8),
        life: rand(0.22, 0.5),
        t: 0,
        r: rand(1.1, 2.4),
      });
    }
  }

  function land(plat) {
    player.y = plat.y;
    player.vy = 0;
    player.vx = 0;
    player.onGround = plat;
    lastFooting = plat.y;
    squash = 1.18;
    puff(9, 0);

    if (plat.type === 'fiktif' && plat.crumble === 0) plat.crumble = 0.0001;

    if (plat.gold && !plat.taken) {
      plat.taken = true;
      money += params.moneyValue;
      weight += 1;
      floaters.push({ x: plat.x, y: plat.y - 46, t: 0, text: '+' + rupiah(params.moneyValue) });
    }

    rebuildAhead();
  }

  // ---------- simulation ----------

  function step(dt) {
    if (phase !== 'playing') return;

    const p = player;
    const prevY = p.y;

    // A dead ledge cannot hold the player.
    if (p.onGround && !p.onGround.alive) p.onGround = null;

    if (p.onGround) {
      p.x = clamp(p.x, 12, W - 12);
      p.y = p.onGround.y;
      p.vx = 0;
      p.vy = 0;
    } else {
      p.vy += params.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      if (p.x < 12) {
        p.x = 12;
        p.vx = 0;
      } else if (p.x > W - 12) {
        p.x = W - 12;
        p.vx = 0;
      }

      if (p.vy > 0) {
        for (const plat of platforms) {
          if (!plat.alive) continue;
          if (prevY <= plat.y && p.y >= plat.y && Math.abs(p.x - plat.x) <= plat.w / 2 + 6) {
            land(plat);
            break;
          }
        }
      }
    }

    for (const plat of platforms) {
      if (plat.crumble <= 0) continue;
      plat.crumble += dt;
      if (plat.alive && plat.crumble >= params.crumbleDelay) {
        plat.alive = false;
        if (p.onGround === plat) p.onGround = null;

        // Show the thing breaking, so a vanishing ledge never reads as a bug.
        for (let i = 0; i < 10; i++) {
          dust.push({
            x: plat.x + rand(-plat.w / 2, plat.w / 2),
            y: plat.y + rand(0, 6),
            vx: rand(-46, 46),
            vy: rand(-34, 18),
            life: rand(0.3, 0.65),
            t: 0,
            r: rand(1, 2.6),
          });
        }
      }
    }

    for (const a of auditors) {
      a.x += a.dir * a.speed * dt;
      if (a.x < a.minX) {
        a.x = a.minX;
        a.dir = 1;
      } else if (a.x > a.maxX) {
        a.x = a.maxX;
        a.dir = -1;
      }
      a.y = a.upper.y - 11;

      if (
        Math.abs(a.x - p.x) < (a.w + 18) / 2 &&
        p.y - 30 < a.y + a.h / 2 &&
        p.y > a.y - a.h / 2
      ) {
        endRun('auditor');
        return;
      }
    }
    auditors = auditors.filter((a) => a.upper.alive);

    camSpeed += params.cameraAccel * dt;
    camY -= camSpeed * dt;

    const follow = p.y - H * 0.62;
    if (follow < camY) camY += (follow - camY) * Math.min(1, dt * 12);

    maxClimb = Math.max(maxClimb, -p.y);

    if (platforms.length > 60) {
      const cutoff = camY + H + 420;
      platforms = platforms.filter((plat) => plat.y < cutoff || plat === p.onGround);
    }

    for (const f of floaters) {
      f.t += dt;
      f.y -= 30 * dt;
    }
    floaters = floaters.filter((f) => f.t < 1.2);

    shake = Math.max(0, shake - dt * 2.5);
    squash += (1 - squash) * Math.min(1, dt * 16);

    for (const d of dust) {
      d.t += dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.vy += 190 * dt;
    }
    dust = dust.filter((d) => d.t < d.life);

    if (p.y > camY + H) {
      // Well below the last ledge means a missed jump; otherwise the audit
      // simply caught up with a player who could not climb fast enough.
      endRun(!p.onGround && p.y > lastFooting + 180 ? 'fall' : 'band');
    }
  }

  // ---------- rendering ----------

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = Math.max(260, Math.round(rect.width));
    H = Math.max(320, Math.round(rect.height));
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = round(W * dpr);
    canvas.height = round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawPlatform(plat) {
    const top = plat.y - camY;
    const x = plat.x - plat.w / 2;

    if (!plat.alive) {
      if (plat.crumble <= 0) return;
      const fade = clamp(1 - (plat.crumble - params.crumbleDelay) / 0.3, 0, 1);
      if (fade <= 0) return;
      ctx.globalAlpha = fade * 0.45;
      ctx.fillStyle = C.paperDark;
      roundRect(x, top + (1 - fade) * 16, plat.w, 6, 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }

    const wobble = plat.crumble > 0 ? Math.sin(plat.crumble * 70) * 2.2 : 0;
    const bodyH = plat.type === 'krat' ? 13 : 11;

    // the shadow the ledge throws on the wall behind it
    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    roundRect(x + wobble + 5, top + bodyH + 2, plat.w - 10, 4, 2);
    ctx.fill();

    if (plat.type === 'fiktif') {
      ctx.fillStyle = plat.gold ? 'rgba(227, 176, 75, 0.12)' : 'rgba(143, 134, 116, 0.1)';
      roundRect(x + wobble, top, plat.w, bodyH, 3);
      ctx.fill();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = plat.gold ? 'rgba(227, 176, 75, 0.9)' : 'rgba(143, 134, 116, 0.7)';
      ctx.lineWidth = 1.4;
      roundRect(x + wobble, top, plat.w, bodyH, 3);
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      const g = ctx.createLinearGradient(0, top, 0, top + bodyH);
      if (plat.gold) {
        g.addColorStop(0, C.goldLight);
        g.addColorStop(1, C.goldDark);
      } else if (plat.type === 'krat') {
        g.addColorStop(0, '#A07C57');
        g.addColorStop(1, C.crateDark);
      } else {
        g.addColorStop(0, C.paper);
        g.addColorStop(1, C.paperMid);
      }
      ctx.fillStyle = g;
      roundRect(x + wobble, top, plat.w, bodyH, 3);
      ctx.fill();

      // the top edge is the part that catches the light
      ctx.fillStyle = plat.gold ? 'rgba(255, 246, 224, 0.7)' : 'rgba(255, 255, 255, 0.45)';
      ctx.fillRect(x + wobble + 4, top + 1.2, plat.w - 8, 1.3);

      if (plat.type === 'krat') {
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 3; i++) {
          const lx = x + wobble + (plat.w * i) / 3;
          ctx.beginPath();
          ctx.moveTo(lx, top + 2);
          ctx.lineTo(lx, top + bodyH - 2);
          ctx.stroke();
        }
      }
    }

    if (plat.gold && !plat.taken) drawMoney(plat.x + wobble, top - 18);
  }

  function drawMoney(x, y) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    roundRect(-10, -5.5, 21, 14, 2);
    ctx.fill();

    ctx.fillStyle = '#F6E3B4';
    roundRect(-11, -8, 22, 14, 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(152, 109, 29, 0.6)';
    ctx.lineWidth = 1;
    roundRect(-11, -8, 22, 14, 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-10, -7);
    ctx.lineTo(0, 0);
    ctx.lineTo(10, -7);
    ctx.stroke();

    // wax seal: the envelope is official, that is the whole joke
    ctx.fillStyle = C.red;
    ctx.beginPath();
    ctx.arc(0, 1.5, 2.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawAuditor(a) {
    const y = a.y - camY;
    if (y < -40 || y > H + 40) return;

    ctx.globalAlpha = 0.12;
    ctx.fillStyle = C.red;
    roundRect(a.x - a.dir * 8 - a.w / 2, y - a.h / 2, a.w, a.h, 4);
    ctx.fill();
    roundRect(a.x - a.dir * 15 - a.w / 2, y - a.h / 2, a.w, a.h, 4);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = C.red;
    roundRect(a.x - a.w / 2, y - a.h / 2, a.w, a.h, 4);
    ctx.fill();

    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fillRect(a.x - a.w / 2 + 5, y - 3, a.w - 10, 4);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.fillRect(a.x - a.w / 2 + 5, y - a.h / 2 + 3, a.w - 10, 2);
  }

  function drawPlayer() {
    const x = player.x;
    const y = player.y - camY;
    const sx = squash;
    const sy = 2 - squash;

    if (player.onGround) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.34)';
      ctx.beginPath();
      ctx.ellipse(x, y, 12, 3.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    const lean = player.onGround ? 0 : clamp(player.vx / 420, -0.14, 0.14);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(lean);
    ctx.scale(sx, sy);

    ctx.fillStyle = '#161F29';
    roundRect(-7, -8, 14, 8, 2);
    ctx.fill();

    ctx.fillStyle = C.suit;
    roundRect(-9, -27, 18, 20, 4);
    ctx.fill();

    ctx.fillStyle = 'rgba(240, 233, 219, 0.9)';
    ctx.beginPath();
    ctx.moveTo(-4, -27);
    ctx.lineTo(0, -22);
    ctx.lineTo(4, -27);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = C.gold;
    ctx.beginPath();
    ctx.moveTo(0, -23);
    ctx.lineTo(3, -20);
    ctx.lineTo(0, -11);
    ctx.lineTo(-3, -20);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = C.skin;
    ctx.beginPath();
    ctx.arc(0, -33, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(-7.5, -36.5, 15, 3);

    ctx.strokeStyle = 'rgba(240, 233, 219, 0.16)';
    ctx.lineWidth = 1;
    roundRect(-9, -27, 18, 20, 4);
    ctx.stroke();

    ctx.restore();
  }

  function drawBand() {
    const bandH = 68;
    const y = H - bandH;

    const grad = ctx.createLinearGradient(0, y, 0, H);
    grad.addColorStop(0, 'rgba(217, 72, 59, 0)');
    grad.addColorStop(1, 'rgba(217, 72, 59, 0.4)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, y, W, bandH);

    // hazard tape: the audit is a place you can fall into
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y, W, bandH);
    ctx.clip();
    ctx.strokeStyle = 'rgba(217, 72, 59, 0.16)';
    ctx.lineWidth = 7;
    for (let i = -bandH; i < W + bandH; i += 26) {
      ctx.beginPath();
      ctx.moveTo(i, H + 6);
      ctx.lineTo(i + bandH, y - 6);
      ctx.stroke();
    }
    ctx.restore();

    ctx.setLineDash([9, 7]);
    ctx.strokeStyle = 'rgba(217, 72, 59, 0.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(217, 72, 59, 0.9)';
    ctx.font = '700 9px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('TIM AUDIT', 12, H - 10);

    const closeness = clamp(1 - (camY + H - player.y) / 240, 0, 1);
    if (closeness > 0) {
      ctx.fillStyle = `rgba(217, 72, 59, ${0.05 + closeness * 0.15})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = C.inkDeep;
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(W / 2, H * 0.04, 20, W / 2, H * 0.2, H * 0.85);
    glow.addColorStop(0, 'rgba(227, 176, 75, 0.09)');
    glow.addColorStop(0.5, 'rgba(227, 176, 75, 0.025)');
    glow.addColorStop(1, 'rgba(227, 176, 75, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    if (shake > 0) {
      const s = shake * 7;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    // shelf lines: the only thing telling you how far you have climbed
    const gap = 88;
    const first = Math.ceil(camY / gap) * gap;
    for (let wy = first; wy < camY + H + gap; wy += gap) {
      const sy = wy - camY;
      ctx.fillStyle = 'rgba(240, 233, 219, 0.035)';
      ctx.fillRect(0, sy, W, 1);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fillRect(0, sy + 1, W, 6);
    }

    ctx.fillStyle = 'rgba(240, 233, 219, 0.03)';
    ctx.fillRect(0, 0, 3, H);
    ctx.fillRect(W - 3, 0, 3, H);

    for (const plat of platforms) {
      const top = plat.y - camY;
      if (top < -60 || top > H + 60) continue;

      // Ledges behind the player stay visible, just dimmer with distance: the
      // route taken is part of the scenery, not something that vanished.
      let alpha = 1;
      if (plat !== player.onGround && plat.y > player.y) {
        alpha = clamp(1 - (plat.y - player.y) / (H * 0.95), 0.34, 1);
      }
      ctx.globalAlpha = alpha;
      drawPlatform(plat);
      ctx.globalAlpha = 1;
    }

    for (const a of auditors) drawAuditor(a);

    for (const d of dust) {
      const a = clamp(1 - d.t / d.life, 0, 1);
      ctx.fillStyle = `rgba(201, 192, 175, ${a * 0.5})`;
      ctx.beginPath();
      ctx.arc(d.x, d.y - camY, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (phase !== 'over') drawPlayer();

    ctx.textAlign = 'center';
    for (const f of floaters) {
      const life = clamp(1 - f.t / 1.2, 0, 1);
      const pop = 1 + Math.max(0, 0.22 - f.t) * 1.6;
      ctx.save();
      ctx.translate(f.x, f.y - camY);
      ctx.scale(pop, pop);
      ctx.font = '700 10px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = `rgba(227, 176, 75, ${life})`;
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }

    const vig = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.22, W / 2, H * 0.55, H * 0.85);
    vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vig.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    drawBand();
  }

  // ---------- HUD and overlay ----------

  let hudCache = '';

  function updateHud() {
    const key = money + '|' + height() + '|' + weight;
    if (key === hudCache) return;
    hudCache = key;

    hudMoney.textContent = rupiah(money);
    hudHeight.textContent = height() + ' m';
    hudWeight.textContent = 'Beban ' + weight;

    const pct = clamp((weight / 12) * 100, 0, 100);
    hudBar.style.width = pct + '%';
    hudBar.style.background =
      weight >= 8 ? C.red : weight >= 5 ? C.gold : 'rgba(227, 176, 75, 0.65)';
  }

  function buildLabel() {
    const raw = document.documentElement.dataset.build || '';
    return raw && !raw.includes('__BUILD__') ? raw : 'dev';
  }

  function showReady() {
    overlay.innerHTML = `
      <div class="card ready">
        <div>
          <p class="eyebrow">prototipe</p>
          <h1>Korupsi</h1>
          <p class="lede">Dua pijakan tiap jenjang. Ambil yang bergaris emas untuk skor,
            tapi makin berat, makin pendek lompatanmu.</p>
          <div class="legend">
            <span><i class="dot" style="background:#C9C0AF"></i>aman</span>
            <span><i class="dot" style="background:#E3B04B"></i>amplop</span>
            <span><i class="dot" style="background:#D9483B"></i>auditor</span>
          </div>
        </div>
        <div>
          <p class="cta">Tap untuk mulai</p>
          <p class="rev">rev ${buildLabel()}</p>
        </div>
      </div>`;
    overlay.classList.add('is-visible');
    document.body.classList.remove('is-playing');
  }

  function showResult() {
    const met = height();
    const eyebrow = cause === 'auditor' ? 'tertangkap' : cause === 'fall' ? 'terjatuh' : 'ketinggalan';

    let line;
    if (cause === 'auditor') {
      line = weight
        ? `Ditangkap dengan ${weight} amplop di dalam tas.`
        : 'Ditangkap tanpa membawa apa pun. Tetap diperiksa.';
    } else if (cause === 'fall') {
      line = weight
        ? `Jatuh, ${weight} amplop ikut berhamburan.`
        : 'Jatuh dari pijakan yang belum diresmikan.';
    } else {
      line = weight
        ? `${weight} amplop, semuanya tercatat di berkas.`
        : 'Tangan kosong, tetap dicurigai.';
    }

    overlay.innerHTML = `
      <div class="card">
        <p class="stamp">${eyebrow}</p>
        <h1 class="money">${rupiah(money)}</h1>
        <p class="lede">${line}</p>
        <div class="stats">
          <span><i>Amplop</i><b>${weight}</b></span>
          <span><i>Tinggi</i><b>${met} m</b></span>
        </div>
        <p class="record">Rekor ${rupiah(best.money)}</p>
        <p class="cta">Tap untuk ulang</p>
      </div>`;
    overlay.classList.add('is-visible');
    document.body.classList.remove('is-playing');
  }

  // ---------- input ----------

  function tap(clientX) {
    if (phase !== 'playing') {
      start();
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const dir = clientX < rect.left + rect.width / 2 ? -1 : 1;
    jump(dir);
  }

  canvas.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    canvas.focus({ preventScroll: true });
    tap(event.clientX);
  });

  window.addEventListener('keydown', (event) => {
    if (event.repeat) return;
    if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
      if (phase === 'playing') jump(-1);
      else tap(W * 0.25);
      event.preventDefault();
    } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
      if (phase === 'playing') jump(1);
      else tap(W * 0.75);
      event.preventDefault();
    } else if (event.key === ' ' || event.key === 'Enter') {
      tap(W / 2 + player.dir);
      event.preventDefault();
    }
  });

  canvas.addEventListener('contextmenu', (event) => event.preventDefault());

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    resize();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (phase !== 'playing') {
        resetWorld();
        draw();
      }
    }, 120);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) lastFrame = performance.now();
  });

  // ---------- debug ----------

  const DEBUG = new URLSearchParams(location.search).has('debug');
  const debugPanel = DEBUG ? document.getElementById('debug') : null;

  // Debug handle: lets the balance harness drive the simulation without a
  // browser and inspect what the player can actually see.
  if (DEBUG) {
    Object.defineProperty(window, '__korupsi', {
      value: {
        get phase() { return phase; },
        get platforms() { return platforms; },
        get auditors() { return auditors; },
        get player() { return player; },
        get camY() { return camY; },
        get camSpeed() { return camSpeed; },
        get money() { return money; },
        get weight() { return weight; },
        get maxClimb() { return maxClimb; },
        get cause() { return cause; },
        step,
        jump,
        start,
        params,
      },
      configurable: true,
    });
  }

  function buildDebug() {
    const panel = debugPanel;
    panel.classList.add('is-on');

    const controls = [
      { key: 'jumpV', label: 'Lompat', min: 500, max: 900, step: 10 },
      { key: 'gravity', label: 'Gravitasi', min: 1200, max: 2600, step: 20 },
      { key: 'weightPenalty', label: 'Berat/amplop', min: 0, max: 0.12, step: 0.005 },
      { key: 'cameraBase', label: 'Scroll awal', min: 6, max: 60, step: 1 },
      { key: 'cameraAccel', label: 'Scroll naik', min: 0, max: 1.5, step: 0.05 },
      { key: 'goldChance', label: 'Peluang emas', min: 0, max: 1, step: 0.05 },
    ];

    panel.innerHTML =
      controls
        .map(
          (c) => `
          <label>${c.label} <b data-out="${c.key}">${params[c.key]}</b>
            <input type="range" data-key="${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${params[c.key]}">
          </label>`
        )
        .join('') + '<div class="readout" data-readout></div>';

    panel.addEventListener('input', (event) => {
      const input = event.target.closest('input[data-key]');
      if (!input) return;
      const key = input.dataset.key;
      params[key] = Number(input.value);
      panel.querySelector(`[data-out="${key}"]`).textContent = params[key];
    });

    const readout = panel.querySelector('[data-readout]');
    setInterval(() => {
      const env = envelope(jumpFactor());
      readout.textContent =
        `factor ${jumpFactor().toFixed(2)} · rise ${round(env.h)}px · ` +
        `air ${env.air.toFixed(2)}s · scroll ${camSpeed.toFixed(0)}px/s`;
    }, 250);
  }

  // ---------- loop ----------

  let lastFrame = performance.now();
  let acc = 0;
  const STEP = 1 / 120;

  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    if (phase === 'playing') {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard++ < 8) {
        step(STEP);
        acc -= STEP;
        if (phase !== 'playing') break;
      }
    } else {
      acc = 0;
    }

    draw();
    updateHud();
    if (debugPanel) debugPanel.classList.toggle('is-muted', phase !== 'playing');
    requestAnimationFrame(frame);
  }

  resize();
  resetWorld();
  showReady();
  if (DEBUG) buildDebug();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
