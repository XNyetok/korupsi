name: Deploy

# Ships one tagged release to production. release.yml calls this when
# release-please publishes a release; it can also be run by hand from the
# Actions tab to redeploy a tag, which is also how to roll back through CI.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, for example v0.3.0 (v0.3.0 or later)
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tag is a release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag like v1.2.3"; exit 1; }

  build:
    name: Build
    needs: [check]
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
      release: true

  deploy:
    name: Deploy to VPS
    needs: [build]
    # The switch still pauses deploys; the environment adds the approval and
    # tag rules configured in the repository settings.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://korupsi.web.id
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      COLLECTOR_PATH: /opt/korupsi-stats
      SITE: https://korupsi.web.id
    steps:
      - name: Check the build matches the tag
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [ "$TAG" = "v$VERSION" ] || { echo "::error::tag $TAG does not match package.json version $VERSION"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          sparse-checkout: deploy
          path: repo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collector
          path: server

      - name: Check deploy settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          set -euo pipefail
          # A variable missing from GitHub arrives as an empty string, and an empty
          # path would point rsync and the cleanup at the wrong directory.
          failed=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_PATH; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; failed=1; fi
          done
          [ "$HAS_SSH_KEY" = "true" ] || { echo "::error::secret DEPLOY_SSH_KEY is not set"; failed=1; }
          [ "$HAS_KNOWN_HOSTS" = "true" ] || { echo "::error::secret DEPLOY_KNOWN_HOSTS is not set"; failed=1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "::error::DEPLOY_PORT must be a number"; failed=1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::DEPLOY_USER has unexpected characters"; failed=1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "::error::DEPLOY_HOST has unexpected characters"; failed=1; }
          # Absolute, at least two levels deep, no "..", no spaces or shell characters.
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$ ]] && [[ "$DEPLOY_PATH" != *..* ]] \
            || { echo "::error::DEPLOY_PATH must be an absolute path like /www/wwwroot/site"; failed=1; }
          exit "$failed"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # One place for the connection settings, so every step uses the same ones.
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Name the release
        id: release
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          release="${TAG}-${SHA}"
          echo "name=$release" >>"$GITHUB_OUTPUT"
          # The collector reports this in its health answer, so the deploy can
          # tell the new code from the old after a restart.
          printf '%s\n' "$release" > server/RELEASE
          echo "Release folder: $release"

      - name: Upload the site and the collector
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          # Fresh folders: what is live is untouched while this runs.
          rsync -rlptz --delete --mkpath dist/ "production:$DEPLOY_PATH/releases/$RELEASE/"
          rsync -rlptz --delete --mkpath server/ "production:$COLLECTOR_PATH/releases/$RELEASE/"

      - name: Apply the server config of this release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # deploy/apply-config.sh, installed once as root. It downloads the
          # nginx files and the unit from this tag itself and restores the old
          # ones if nginx -t, systemd-analyze or the reload fails.
          if ! ssh production test -x /usr/local/sbin/korupsi-apply-config; then
            echo "::warning::korupsi-apply-config is not installed on the server; nginx and systemd config were not applied (docs/deploy.md)"
            exit 0
          fi
          ssh production sudo -n /usr/local/sbin/korupsi-apply-config "$TAG"

      - name: Switch the collector, then the site
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          # Checks Node, restarts the collector and waits for it to report this
          # release before the site moves. See deploy/remote.sh.
          ssh production bash -s -- activate "$DEPLOY_PATH" "$COLLECTOR_PATH" "$RELEASE" < repo/deploy/remote.sh

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          for path in / /og.png /sw.js; do
            code=$(curl -fsS --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' "${SITE}${path}")
            echo "$code $path"
            [ "$code" = "200" ]
          done

          # The page that is live must be the one this run built, not just any page.
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -n1)
          live=$(curl -fsS -H 'Cache-Control: no-cache' "${SITE}/?smoke=${GITHUB_RUN_ID}")
          grep -qF "$expected" <<<"$live" || { echo "::error::live page does not load $expected"; exit 1; }
          echo "live page loads $expected"

          # Old installs only stop caching once they fetch the kill switch.
          worker=$(curl -fsS "${SITE}/sw.js")
          grep -qF 'registration.unregister' <<<"$worker" \
            || { echo "::error::/sw.js is not the kill switch"; exit 1; }

      - name: Roll back after a failed smoke test
        if: failure() && steps.smoke.conclusion == 'failure'
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          echo "::error::the smoke test failed, going back to the previous release"
          ssh production bash -s -- rollback "$DEPLOY_PATH" "$COLLECTOR_PATH" < repo/deploy/remote.sh
