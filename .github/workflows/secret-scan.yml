name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan history for credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan every commit
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --verbose .

  hygiene:
    name: Check tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject environment and key files
        run: |
          set -euo pipefail
          matches=$(git ls-files | grep -Ei \
            '(^|/)\.env($|\.|/)|\.(pem|key|p12|pfx|jks|keystore)$|(^|/)id_(rsa|ed25519)|credentials\.json$|service-account.*\.json$' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$matches" ]; then
            echo "These files must not be tracked:"
            echo "$matches"
            exit 1
          fi

      - name: Reject large files
        run: |
          set -euo pipefail
          limit=$((5 * 1024 * 1024))
          failed=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            size=$(wc -c <"$file")
            if [ "$size" -gt "$limit" ]; then
              echo "$file is $size bytes"
              failed=1
            fi
          done < <(git ls-files)
          exit "$failed"
