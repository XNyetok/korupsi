name: Release

# Push a tag like v0.4.0 → every CI check runs on it, and a DRAFT GitHub Release
# is created with the built site, the collector and their SHA-256 sums. Nothing
# reaches players until a maintainer reviews the draft and publishes it; that
# starts deploy.yml. Same pattern as Havus (docs/deploy.md, Releases).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: tag
        name: The tag is vX.Y.Z and on main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::'$GITHUB_REF_NAME' is not a release tag like v1.2.3"; exit 1; }
          # Only what main already has can be released.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME points to a commit that is not on main"; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [check]
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.check.outputs.version }}

  draft:
    name: Draft the release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed only to create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collector
          path: server

      - name: Package the site and the collector
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release
          tar -czf "release/korupsi-site-$VERSION.tar.gz" -C dist .
          tar -czf "release/korupsi-collector-$VERSION.tar.gz" -C server .
          (cd release && sha256sum korupsi-*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rerun may refresh a draft's files, never a published release's.
            draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            [ "$draft" = "true" ] \
              || { echo "::error::$GITHUB_REF_NAME is already published; its files stay as they are"; exit 1; }
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --generate-notes \
              --title "Korupsi $VERSION"
          fi
          echo "Draft ready: review the notes, then publish to deploy."
