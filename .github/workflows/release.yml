name: Release

# release-please keeps a release PR open that bumps package.json and writes
# CHANGELOG.md from the Conventional Commits on main. Merging that PR creates
# the tag and the GitHub Release, and this workflow then deploys it.
#
# Everything here uses GITHUB_TOKEN, and GitHub starts no workflows for what
# that token creates. So the deploy is a job in this run rather than a separate
# workflow listening for the release event, and the checks on the release PR
# are started explicitly.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # 1. Tag and publish a merged release PR. This alone decides the deploy.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # 2. Open or update the next release PR. The organisation may forbid
      #    GITHUB_TOKEN from creating pull requests; then this step fails on its
      #    own and the release PR is opened by hand (docs/deploy.md, Releases).
      - id: rp
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Run the checks on the release PR
        if: steps.rp.outputs.prs_created == 'true' && steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "Started CI on $BRANCH"

  deploy:
    name: Deploy
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
