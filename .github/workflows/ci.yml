name: CI

# Builds and tests every push and pull request. Nothing here deploys: production
# is deployed from a release, by release.yml and deploy.yml.
on:
  push:
    branches: [main]
  pull_request:
  # release.yml dispatches this on the release PR branch, because a PR opened
  # with GITHUB_TOKEN does not trigger workflows on its own.
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build, for example a release tag
        type: string
        required: true
      release:
        description: Label the build as a release (X.Y.Z+sha) instead of a dev build
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      sha:
        value: ${{ jobs.build.outputs.sha }}
      label:
        value: ${{ jobs.build.outputs.label }}

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (verified checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Scan the full Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  hygiene:
    name: Check tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Reject environment and key files
        run: |
          set -euo pipefail
          matches=$(git ls-files | grep -Ei \
            '(^|/)\.env($|\.|/)|\.(pem|key|p12|pfx|jks|keystore)$|(^|/)id_(rsa|ed25519)|credentials\.json$|service-account.*\.json$' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$matches" ]; then
            echo "These files must not be tracked:"
            echo "$matches"
            exit 1
          fi

      - name: Reject large files
        run: |
          set -euo pipefail
          limit=$((5 * 1024 * 1024))
          failed=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            size=$(wc -c <"$file")
            if [ "$size" -gt "$limit" ]; then
              echo "$file is $size bytes"
              failed=1
            fi
          done < <(git ls-files)
          exit "$failed"

      - name: Check the nginx config
        run: |
          set -euo pipefail
          # The two files are includes, so wrap them the way the panel does: the
          # limits at http level, the rewrite rules inside the site's server block.
          mkdir -p "$RUNNER_TEMP/nginx"
          cat > "$RUNNER_TEMP/nginx/nginx.conf" <<'EOF'
          events {}
          http {
            include /repo/deploy/nginx/korupsi-limits.conf;
            server {
              listen 8080;
              server_name korupsi.web.id www.korupsi.web.id;
              include /repo/deploy/nginx/korupsi-rewrite.conf;
            }
          }
          EOF
          docker run --rm --network none \
            -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311 \
            nginx -t

      - name: Lint the shell scripts
        run: shellcheck deploy/*.sh .githooks/pre-commit scripts/*.sh

  build:
    name: Type-check & build
    needs: [secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.label.outputs.version }}
      sha: ${{ steps.label.outputs.sha }}
      label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test the simulation
        run: npm test

      - name: Name the build
        id: label
        env:
          RELEASE_BUILD: ${{ inputs.release && 'true' || 'false' }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          sha=$(git rev-parse --short=7 HEAD)
          # One identity everywhere: the ready screen, telemetry, release folders.
          if [ "$RELEASE_BUILD" = "true" ]; then label="${version}+${sha}"; else label="${version}-dev+${sha}"; fi
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "label=$label"
          } >>"$GITHUB_OUTPUT"
          echo "Build label: $label"

      - name: Build
        env:
          BUILD_LABEL: ${{ steps.label.outputs.label }}
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector
          path: server/
          retention-days: 7
          if-no-files-found: error
