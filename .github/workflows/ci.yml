name: Build & deploy

# Every push and pull request is checked. A push to main that passes every
# check is deployed, like Nyetok: no release step in between (docs/deploy.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (verified checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Scan the full Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  hygiene:
    name: Check tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject environment and key files
        run: |
          set -euo pipefail
          matches=$(git ls-files | grep -Ei \
            '(^|/)\.env($|\.|/)|\.(pem|key|p12|pfx|jks|keystore)$|(^|/)id_(rsa|ed25519)|credentials\.json$|service-account.*\.json$' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$matches" ]; then
            echo "These files must not be tracked:"
            echo "$matches"
            exit 1
          fi

      - name: Reject large files
        run: |
          set -euo pipefail
          limit=$((5 * 1024 * 1024))
          failed=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            size=$(wc -c <"$file")
            if [ "$size" -gt "$limit" ]; then
              echo "$file is $size bytes"
              failed=1
            fi
          done < <(git ls-files)
          exit "$failed"

      - name: Check the nginx config
        run: |
          set -euo pipefail
          # The two files are includes, so wrap them the way the panel does: the
          # limits at http level, the rewrite rules inside the site's server block.
          mkdir -p "$RUNNER_TEMP/nginx"
          cat > "$RUNNER_TEMP/nginx/nginx.conf" <<'EOF'
          events {}
          http {
            include /repo/deploy/nginx/korupsi-limits.conf;
            server {
              listen 8080;
              server_name korupsi.web.id www.korupsi.web.id;
              include /repo/deploy/nginx/korupsi-rewrite.conf;
            }
          }
          EOF
          docker run --rm --network none \
            -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311 \
            nginx -t

      - name: Lint the shell scripts
        run: shellcheck deploy/*.sh .githooks/pre-commit scripts/*.sh

  build:
    name: Type-check & build
    needs: [secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.label.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Test the simulation
        run: npm test

      - name: Name the build
        id: label
        env:
          ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          sha=$(git rev-parse --short=7 HEAD)
          # What main deploys is "X.Y.Z+sha"; anything else is a "-dev" build.
          if [ "$ON_MAIN" = "true" ]; then label="${version}+${sha}"; else label="${version}-dev+${sha}"; fi
          {
            echo "sha=$sha"
            echo "label=$label"
          } >>"$GITHUB_OUTPUT"
          echo "Build label: $label"

      - name: Build
        env:
          BUILD_LABEL: ${{ steps.label.outputs.label }}
        run: npm run build

      - name: Check the size budget
        run: npm run size

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector
          path: server/
          retention-days: 7
          if-no-files-found: error

  browser:
    name: Browser smoke tests
    needs: [secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the smoke tests
        run: npm run test:e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to VPS
    # Every check has to pass; DEPLOY_ENABLED=false pauses deploying.
    needs: [secrets, hygiene, build, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://korupsi.web.id
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      COLLECTOR_PATH: /opt/korupsi-stats
      SITE: https://korupsi.web.id
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
          path: repo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collector
          path: server

      - name: Check deploy settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          set -euo pipefail
          # A variable missing from GitHub arrives as an empty string, and an empty
          # path would point rsync and the cleanup at the wrong directory.
          failed=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_PATH; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; failed=1; fi
          done
          [ "$HAS_SSH_KEY" = "true" ] || { echo "::error::secret DEPLOY_SSH_KEY is not set"; failed=1; }
          [ "$HAS_KNOWN_HOSTS" = "true" ] || { echo "::error::secret DEPLOY_KNOWN_HOSTS is not set"; failed=1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "::error::DEPLOY_PORT must be a number"; failed=1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::DEPLOY_USER has unexpected characters"; failed=1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "::error::DEPLOY_HOST has unexpected characters"; failed=1; }
          # Absolute, at least two levels deep, no "..", no spaces or shell characters.
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$ ]] && [[ "$DEPLOY_PATH" != *..* ]] \
            || { echo "::error::DEPLOY_PATH must be an absolute path like /www/wwwroot/site"; failed=1; }
          exit "$failed"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # One place for the connection settings, so every step uses the same ones.
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Name the release
        id: release
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          # Same folder names as Nyetok: UTC time, then the commit.
          release="$(date -u +%Y%m%d%H%M%S)-${SHA}"
          echo "name=$release" >>"$GITHUB_OUTPUT"
          # The collector reports this in its health answer, so the deploy can
          # tell the new code from the old after a restart.
          printf '%s\n' "$release" > server/RELEASE
          echo "Release folder: $release"

      - name: Upload the site and the collector
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          # Fresh folders: what is live is untouched while this runs.
          rsync -rlptz --delete --mkpath dist/ "production:$DEPLOY_PATH/releases/$RELEASE/"
          rsync -rlptz --delete --mkpath server/ "production:$COLLECTOR_PATH/releases/$RELEASE/"

      - name: Switch the collector, then the site
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          # Checks Node, restarts the collector and waits for it to report this
          # release before the site moves. See deploy/remote.sh.
          ssh production bash -s -- activate "$DEPLOY_PATH" "$COLLECTOR_PATH" "$RELEASE" < repo/deploy/remote.sh

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          for path in / /og.png /sw.js; do
            code=$(curl -fsS --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' "${SITE}${path}")
            echo "$code $path"
            [ "$code" = "200" ]
          done

          # The page that is live must be the one this run built, not just any page.
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -n1)
          live=$(curl -fsS -H 'Cache-Control: no-cache' "${SITE}/?smoke=${GITHUB_RUN_ID}")
          grep -qF "$expected" <<<"$live" || { echo "::error::live page does not load $expected"; exit 1; }
          echo "live page loads $expected"

          # Old installs only stop caching once they fetch the kill switch.
          worker=$(curl -fsS "${SITE}/sw.js")
          grep -qF 'registration.unregister' <<<"$worker" \
            || { echo "::error::/sw.js is not the kill switch"; exit 1; }

      - name: Roll back after a failed smoke test
        if: failure() && steps.smoke.conclusion == 'failure'
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          echo "::error::the smoke test failed, going back to the previous release"
          ssh production bash -s -- rollback "$DEPLOY_PATH" "$COLLECTOR_PATH" < repo/deploy/remote.sh
