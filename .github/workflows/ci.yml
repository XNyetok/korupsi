name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (verified checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Scan the full Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  hygiene:
    name: Check tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject environment and key files
        run: |
          set -euo pipefail
          matches=$(git ls-files | grep -Ei \
            '(^|/)\.env($|\.|/)|\.(pem|key|p12|pfx|jks|keystore)$|(^|/)id_(rsa|ed25519)|credentials\.json$|service-account.*\.json$' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$matches" ]; then
            echo "These files must not be tracked:"
            echo "$matches"
            exit 1
          fi

      - name: Reject large files
        run: |
          set -euo pipefail
          limit=$((5 * 1024 * 1024))
          failed=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            size=$(wc -c <"$file")
            if [ "$size" -gt "$limit" ]; then
              echo "$file is $size bytes"
              failed=1
            fi
          done < <(git ls-files)
          exit "$failed"

  build:
    name: Type-check & build
    needs: [secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test the simulation
        run: npm test

      - name: Build
        run: |
          set -euo pipefail
          BUILD_LABEL="r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector
          path: server/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to VPS
    needs: [secrets, hygiene, build]
    # A secret finding or a failing build blocks the deploy; so does the switch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collector
          path: server

      - name: Check deploy settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          set -euo pipefail
          # A variable missing from GitHub arrives as an empty string, and an empty
          # path would point rsync and the cleanup at the wrong directory.
          failed=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_PATH; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; failed=1; fi
          done
          [ "$HAS_SSH_KEY" = "true" ] || { echo "::error::secret DEPLOY_SSH_KEY is not set"; failed=1; }
          [ "$HAS_KNOWN_HOSTS" = "true" ] || { echo "::error::secret DEPLOY_KNOWN_HOSTS is not set"; failed=1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "::error::DEPLOY_PORT must be a number"; failed=1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::DEPLOY_USER has unexpected characters"; failed=1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "::error::DEPLOY_HOST has unexpected characters"; failed=1; }
          # Absolute, at least two levels deep, no "..", no spaces or shell characters.
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$ ]] && [[ "$DEPLOY_PATH" != *..* ]] \
            || { echo "::error::DEPLOY_PATH must be an absolute path like /www/wwwroot/site"; failed=1; }
          exit "$failed"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload release and switch to it
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          ssh_opts=(-i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)

          # 1. Upload into a fresh folder; the live site is untouched while this runs.
          rsync -rlptz --delete --mkpath -e "ssh ${ssh_opts[*]}" dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$release/"

          # 2. Point "current" at it in one atomic step, then keep the 5 newest releases.
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$release" <<'REMOTE'
          set -euo pipefail
          # Refuse to touch anything unless this is the site root it should be.
          [ -n "$1" ] && [ -n "$2" ] && [ "$1" != "/" ] || { echo "bad arguments" >&2; exit 1; }
          cd -- "$1"
          [ -d "releases/$2" ] || { echo "release $2 was not uploaded" >&2; exit 1; }
          ln -sfn "releases/$2" current.next
          mv -Tf current.next current
          ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf --
          echo "Live: releases/$2"
          REMOTE

      - name: Upload collector
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          rsync -rlptz --delete --mkpath -e "ssh ${ssh_opts[*]}" server/ \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/korupsi-stats/"

      - name: Restart collector
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /usr/bin/systemctl restart korupsi-stats && sleep 1 && curl -fsS http://127.0.0.1:8787/api/health'

      - name: Smoke test
        env:
          SITE: https://korupsi.web.id
        run: |
          set -euo pipefail
          for path in / /og.png /sw.js; do
            code=$(curl -fsS --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' "${SITE}${path}")
            echo "$code $path"
            [ "$code" = "200" ]
          done

          # The page that is live must be the one this run built, not just any page.
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -n1)
          live=$(curl -fsS -H 'Cache-Control: no-cache' "${SITE}/?smoke=${GITHUB_SHA::7}")
          grep -qF "$expected" <<<"$live" || { echo "::error::live page does not load $expected"; exit 1; }
          echo "live page loads $expected"

          # Old installs only stop caching once they fetch the kill switch.
          worker=$(curl -fsS "${SITE}/sw.js")
          grep -qF 'registration.unregister' <<<"$worker" \
            || { echo "::error::/sw.js is not the kill switch"; exit 1; }
