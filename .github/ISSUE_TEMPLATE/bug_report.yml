name: Bug report
description: Something behaves differently than it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, tokens, personal data, or private screenshots here.
        This repository is public. Security issues go to the address in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behaviour, as plainly as possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the tower
      description: The floor, and what was nearby (a desk, the stamp, an auditor). The tower is the same on every run, so that is enough to find the spot.
      placeholder: Kelurahan, the desk with the first stamp
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Firefox 133 on macOS 15
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Logs without secrets, screenshots without personal data, related issues.
