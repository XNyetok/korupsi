# Rate limit zones for the telemetry endpoint and the panel.
# Installed as /www/server/panel/vhost/nginx/0.korupsi-limits.conf, which nginx
# includes inside the http block. Kept out of the site vhost because the zone
# directive is only valid at http level.

limit_req_zone $binary_remote_addr zone=beacon:10m rate=30r/m;

# One view of the panel is four requests (the page, its style, its script and
# the numbers), and nginx counts them before it checks the password. The burst
# in the site's rules is sized for that: ten views in a row, then one every
# eight seconds. Password guesses stay capped at this rate.
limit_req_zone $binary_remote_addr zone=panel:10m rate=30r/m;
