# korupsi.web.id — aaPanel "URL rewrite" rules, installed as
# /www/server/panel/vhost/rewrite/korupsi.web.id.conf.
# Source of truth: deploy/nginx/korupsi-rewrite.conf in this repository.
#
# The panel keeps owning the vhost and the certificate, so its renewal keeps working.
# Pages are served from "current", the symlink that each deploy switches atomically.

charset utf-8;

# www → apex. Let's Encrypt checks are answered earlier, by the panel's well-known include.
if ($host = www.korupsi.web.id) {
    return 301 https://korupsi.web.id$request_uri;
}

# Security headers for every response. `expires` does not replace them, but an
# add_header inside a location does, so the one location that adds a header
# repeats this block.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Pages: always revalidate (ETag), so a deploy is visible immediately.
location / {
    root /www/wwwroot/korupsi.web.id/current;
    try_files $uri $uri/ =404;
    expires -1;
}

# Fingerprinted build output: immutable for a year.
location ^~ /assets/ {
    root /www/wwwroot/korupsi.web.id/current;
    try_files $uri =404;
    expires 1y;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# Kill switch for the removed service worker. Old installs fetch this URL to
# update, find a worker that clears its caches and unregisters, and stop
# caching. Never cache it. Remove around 2027-02 together with public/sw.js.
location = /sw.js {
    root /www/wwwroot/korupsi.web.id/current;
    try_files $uri =404;
    expires -1;
}

# Telemetry collector. The service listens on localhost only, so nginx is the
# only way in: it caps the body and rate limits before anything is stored.
# The beacon has to stay public, because the game posts without credentials.
location = /api/beacon {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    client_max_body_size 2k;
    limit_req zone=beacon burst=20 nodelay;
    limit_req_status 429;
    access_log off;
}

# Everything else under /api/ stays on the server, including the health check:
# the deploy reaches it on 127.0.0.1, so it never needs to be public.
location ^~ /api/ {
    return 404;
}

# Reading the numbers is not public.
location = /api/stats {
    auth_basic "Korupsi panel";
    auth_basic_user_file /www/server/nginx/conf/.htpasswd-korupsi;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    limit_req zone=panel burst=10 nodelay;
    limit_req_status 429;
    access_log off;
}

# Read-only panel, behind basic auth. Nothing here writes.
location ^~ /panel/ {
    auth_basic "Korupsi panel";
    auth_basic_user_file /www/server/nginx/conf/.htpasswd-korupsi;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    limit_req zone=panel burst=10 nodelay;
    limit_req_status 429;
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}

# Social card. The panel's image regex serves from the site root, not from
# "current", so this file needs an exact match to be found at all.
location = /og.png {
    root /www/wwwroot/korupsi.web.id/current;
    try_files $uri =404;
    expires 7d;
}

# Icons: stable names, so a short cache rather than immutable.
location ^~ /icons/ {
    root /www/wwwroot/korupsi.web.id/current;
    try_files $uri =404;
    expires 7d;
}

location = /favicon.ico {
    root /www/wwwroot/korupsi.web.id/current;
    log_not_found off;
    access_log off;
    expires 7d;
}
