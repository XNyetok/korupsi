# korupsi.web.id — aaPanel "URL rewrite" rules, installed as
# /www/server/panel/vhost/rewrite/korupsi.web.id.conf.
# Source of truth: deploy/nginx/korupsi-rewrite.conf in this repository.
#
# The panel keeps owning the vhost and the certificate, so its renewal keeps working.
# Pages are served from "current", the symlink that each deploy switches atomically.
#
# An add_header inside a location replaces the server's add_headers, so every location
# that sets a header lists the security headers again.

charset utf-8;

# www → apex. Let's Encrypt checks are answered earlier, by the panel's well-known include.
if ($host = www.korupsi.web.id) {
    return 301 https://korupsi.web.id$request_uri;
}

# Pages: always revalidate (ETag), so a deploy is visible immediately.
location / {
    root /www/wwwroot/korupsi.web.id/current;
    try_files $uri $uri/ =404;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# Fingerprinted build output: cache for a year. Filled once the Vite port lands.
location ^~ /assets/ {
    root /www/wwwroot/korupsi.web.id/current;
    try_files $uri =404;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# The audit band is drawn, not fetched, so there is nothing else to serve.
location = /favicon.ico {
    root /www/wwwroot/korupsi.web.id/current;
    log_not_found off;
    access_log off;
    expires 7d;
}
